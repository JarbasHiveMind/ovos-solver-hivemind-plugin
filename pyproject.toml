[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-solver-hivemind-plugin"
description = "A question solver plugin for OVOS"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-translate-server-plugin",
    "hivemind_bus_client>=1.0.16a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/ovos-solver-hivemind-plugin"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "hivescope>=0.8.5a2",
]
# Alias so gh-automations' `pip install -e ".[dev]"` first-attempt path
# resolves; without `dev` it falls through to a buggy `pip install test`
# literal branch in the upstream workflow.
dev = [
    "pytest",
    "pytest-cov",
    "hivescope>=0.8.5a2",
]

[project.entry-points."opm.solver.question"]
"ovos-solver-hivemind-plugin" = "ovos_hivemind_solver:HiveMindSolver"

[tool.setuptools]
packages = ["ovos_hivemind_solver"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "ovos_hivemind_solver.version.__version__" }
